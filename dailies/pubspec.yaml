name: dailies
description: ''
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  flutter:
    sdk: flutter
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  get_it: ^8.0.3
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5
  sqlite3_flutter_libs: ^0.5.38
  table_calendar: ^3.2.0
  intl: ^0.20.2
  file_picker: ^10.3.1
  collection: ^1.19.1
  icalendar_parser: ^2.1.0
  flutter_local_notifications: ^19.4.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  syncfusion_flutter_pdf: ^30.2.7
  http: ^1.5.0
  flutter_dotenv: ^6.0.0
  google_fonts: ^6.3.1

dev_dependencies:
  flutter_gen_runner: ^5.1.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.6.0
  test: ^1.25.15
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: 'assets/icon.png'
  adaptive_icon_foreground: 'assets/icon_foreground.png'
  adaptive_icon_background: '#ffffff'

flutter:
  uses-material-design: true

  assets:
    - assets/
    - .env

flutter_gen:
  output: lib/generated/
