name: Flutter CI / Build & Release

on:
  push:
    branches: ["v2"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["v2"]

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dailies

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply dart fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
        run: dart fix --apply

      - name: Commit dart fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: apply dart fix [skip ci]"
            git push origin v2
          else
            echo "No dart fixes needed."
          fi

      - name: Run tests
        run: flutter test --coverage

      - name: Build APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
        run: flutter build apk --release --split-per-abi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/

      # ─────────────── RELEASE (ONLY ON TAGS) ───────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1.16.0
        with:
          tag:       ${{ github.ref_name }}
          name:      Release ${{ github.ref_name }}
          artifacts: dailies/artifacts/*.apk
          token:     ${{ secrets.GITHUB_TOKEN }}
